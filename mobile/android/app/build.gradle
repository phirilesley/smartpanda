apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native.
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. Default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to create four separate APKs instead of one,
 * one for each native architecture. This is useful if you don't
 * use App Bundles (https://developer.android.com/guide/app-bundle/)
 * and want to have separate APKs to upload to the Play Store.
 */
def enableSeparateBuildPerCPUArchitecture = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.smartpanda.parent"
    defaultConfig {
        applicationId "com.smartpanda.parent"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    // Multiple APK variants for different app flavors
    flavorDimensions "app"
    productFlavors {
        parent {
            dimension "app"
            applicationIdSuffix ".parent"
            versionNameSuffix "-parent"
            resValue "string", "app_name", "Smart Panda Parent"
            buildConfigField "String", "API_BASE_URL", '"https://api.smartpanda.school/mobile/parent/"'
            buildConfigField "String", "APP_TYPE", '"parent"'
        }
        teacher {
            dimension "app"
            applicationIdSuffix ".teacher"
            versionNameSuffix "-teacher"
            resValue "string", "app_name", "Smart Panda Teacher"
            buildConfigField "String", "API_BASE_URL", '"https://api.smartpanda.school/mobile/teacher/"'
            buildConfigField "String", "APP_TYPE", '"teacher"'
        }
        admin {
            dimension "app"
            applicationIdSuffix ".admin"
            versionNameSuffix "-admin"
            resValue "string", "app_name", "Smart Panda Admin"
            buildConfigField "String", "API_BASE_URL", '"https://api.smartpanda.school/mobile/admin/"'
            buildConfigField "String", "APP_TYPE", '"admin"'
        }
        student {
            dimension "app"
            applicationIdSuffix ".student"
            versionNameSuffix "-student"
            resValue "string", "app_name", "Smart Panda Student"
            buildConfigField "String", "API_BASE_URL", '"https://api.smartpanda.school/mobile/student/"'
            buildConfigField "String", "APP_TYPE", '"student"'
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false  // If true, also generate a universal APK
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            // For each separate APK per architecture, set a unique version code.
            def versionCodes = ["armeabi-v7a": 1, "x86": 2, "arm64-v8a": 3, "x86_64": 4]
            def abi = output.getFilter(OutputFile.ABI)
            if (abi != null) {
                output.versionCodeOverride =
                        defaultConfig.versionCode * 1000 + versionCodes.get(abi)
            }
            
            // Custom APK naming
            def flavor = variant.flavorName
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            def date = new Date().format('yyyyMMdd-HHmm')
            
            output.outputFileName = "SmartPanda-${flavor}-${buildType}-${versionName}-${date}.apk"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.core:core-splashscreen:1.0.1")
    implementation("androidx.multidex:multidex:2.0.1")
    
    // Firebase for push notifications
    implementation(platform("com.google.firebase:firebase-bom:32.7.0"))
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-messaging")
    
    // Network and offline support
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.squareup.retrofit2:retrofit:2.9.0")
    implementation("com.squareup.retrofit2:converter-gson:2.9.0")
    
    // SQLite and storage
    implementation("com.github.anthonycr.grant:permissions:1.0")
    implementation("com.readystatesoftware.sqliteasset:sqliteassethelper:2.0.1")
    
    // Image loading and caching
    implementation("com.github.bumptech.glide:glide:4.16.0")
    
    // Charts for analytics
    implementation("com.github.PhilJay:MPAndroidChart:v3.1.0")
    
    // Biometric authentication
    implementation("androidx.biometric:biometric:1.1.0")
    
    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}")
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }
    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// Custom tasks for building specific APKs
task buildParentDebug(type: Exec) {
    group = 'build'
    description = 'Build Parent Debug APK'
    commandLine './gradlew', 'assembleParentDebug'
}

task buildParentRelease(type: Exec) {
    group = 'build'
    description = 'Build Parent Release APK'
    commandLine './gradlew', 'assembleParentRelease'
}

task buildTeacherDebug(type: Exec) {
    group = 'build'
    description = 'Build Teacher Debug APK'
    commandLine './gradlew', 'assembleTeacherDebug'
}

task buildTeacherRelease(type: Exec) {
    group = 'build'
    description = 'Build Teacher Release APK'
    commandLine './gradlew', 'assembleTeacherRelease'
}

task buildAdminDebug(type: Exec) {
    group = 'build'
    description = 'Build Admin Debug APK'
    commandLine './gradlew', 'assembleAdminDebug'
}

task buildAdminRelease(type: Exec) {
    group = 'build'
    description = 'Build Admin Release APK'
    commandLine './gradlew', 'assembleAdminRelease'
}

task buildStudentDebug(type: Exec) {
    group = 'build'
    description = 'Build Student Debug APK'
    commandLine './gradlew', 'assembleStudentDebug'
}

task buildStudentRelease(type: Exec) {
    group = 'build'
    description = 'Build Student Release APK'
    commandLine './gradlew', 'assembleStudentRelease'
}

task buildAllApks(type: Exec) {
    group = 'build'
    description = 'Build All APKs (Parent, Teacher, Admin, Student)'
    commandLine './gradlew', 'assembleParentDebug', 'assembleTeacherDebug', 'assembleAdminDebug', 'assembleStudentDebug'
}
