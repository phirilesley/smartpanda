<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="description" content="Smart Panda School System - World's Most Advanced School Management Platform with AI Analytics, Mobile Apps, and Real-time Insights" />
    <meta name="keywords" content="school management, education, analytics, AI, mobile app, dashboard" />
    <meta name="author" content="Smart Panda Education Technologies" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smartpanda.school/" />
    <meta property="og:title" content="Smart Panda School System" />
    <meta property="og:description" content="World's Most Advanced School Management Platform" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://smartpanda.school/" />
    <meta property="twitter:title" content="Smart Panda School System" />
    <meta property="twitter:description" content="World's Most Advanced School Management Platform" />
    <meta property="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    
    <!-- Manifest for PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    
    <title>Smart Panda School System</title>
    
    <!-- Inline critical CSS for faster loading -->
    <style>
        /* Critical CSS for loading state */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f9fafb;
        }
        
        .loading-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 500;
        }
        
        /* Hide loading content once React loads */
        .loading-content {
            display: none;
        }
    </style>
</head>
<body>
    <noscript>
        <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
            <h1>JavaScript Required</h1>
            <p>Smart Panda School System requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
            <p>If you're seeing this message, JavaScript may be disabled or blocked by your browser.</p>
        </div>
    </noscript>
    
    <!-- Loading state shown before React loads -->
    <div id="initial-loading" class="loading-container">
        <div>
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading Smart Panda...</div>
        </div>
    </div>
    
    <!-- React app root -->
    <div id="root" class="loading-content"></div>
    
    <!-- Service Worker Registration for PWA -->
    <script>
        // Hide initial loading once React starts loading
        window.addEventListener('load', function() {
            setTimeout(function() {
                const initialLoading = document.getElementById('initial-loading');
                const reactRoot = document.getElementById('root');
                if (initialLoading && reactRoot) {
                    initialLoading.style.display = 'none';
                    reactRoot.style.display = 'block';
                }
            }, 100);
        });
        
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('SW registered: ', registration);
                    })
                    .catch(function(registrationError) {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
        
        // Theme detection
        (function() {
            const theme = localStorage.getItem('theme') || 
                        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.classList.toggle('dark', theme === 'dark');
        })();
        
        // Voice command support detection
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        window.speechSynthesis = window.speechSynthesis || window.webkitSpeechSynthesis;
    </script>
</body>
</html>
